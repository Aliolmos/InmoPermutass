<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favoritos — InmoPermutas</title>
    <meta name="description" content="Tus propiedades guardadas como favoritas en InmoPermutas.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-page="favoritos">

    <header>
        <div class="nav-container">
            <a href="index.html#inicio" class="logo-brand">
                <div class="logo-graphic">
                    <svg viewBox="0 0 120 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="brand-svg">
                        <defs>
                            <linearGradient id="brandGreen" x1="10" y1="15" x2="42" y2="65" gradientUnits="userSpaceOnUse">
                                <stop offset="0" stop-color="#a8f14d"/>
                                <stop offset="1" stop-color="#1fa851"/>
                            </linearGradient>
                            <linearGradient id="brandBlue" x1="24" y1="60" x2="106" y2="70" gradientUnits="userSpaceOnUse">
                                <stop offset="0" stop-color="#5bd0ff"/>
                                <stop offset="1" stop-color="#1f5fd6"/>
                            </linearGradient>
                        </defs>
                        <path d="M 60 6 L 103 40 L 103 66" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M 60 6 L 24 34 L 24 60" stroke="url(#brandGreen)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M 10 46 L 24 62 L 40 46" stroke="url(#brandGreen)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M 98 64 C 112 84 72 94 34 78" stroke="url(#brandBlue)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M 36 64 L 19 78 L 36 92" stroke="url(#brandBlue)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="logo-text-group">
                    <div class="logo-title">Inmo<span class="accent-green">Permutas</span><span class="logo-dot">.com</span></div>
                    <div class="logo-tagline">TU PROPIEDAD, <span class="accent-green">OTRA OPORTUNIDAD</span></div>
                </div>
            </a>
            <button class="nav-toggle" onclick="toggleMobileNav()" aria-label="Abrir menú"><i class="fa-solid fa-bars"></i></button>
            <nav class="nav-menu" id="nav-menu">
                <a href="index.html">Inicio</a>
                <a href="catalogo.html">Propiedades</a>
            </nav>
            <div class="nav-actions">
                <a href="favoritos.html" class="icon-btn has-favs" id="fav-icon-btn" aria-label="Favoritos" title="Favoritos">
                    <i class="fa-solid fa-heart"></i>
                    <span class="fav-count" id="fav-count">0</span>
                </a>
                <a href="publicar.html" class="btn btn-accent"><i class="fa-solid fa-circle-plus"></i> Publicar</a>
            </div>
        </div>
    </header>

    <section class="page-band">
        <div class="container" style="padding-bottom: 2.5rem;">
            <div class="section-header">
                <div class="section-title">
                    <h1 style="font-size: 1.75rem; font-weight: 600;">Tus favoritos</h1>
                    <p id="fav-subtitle">Las propiedades que guardaste para comparar más tarde.</p>
                </div>
            </div>
        </div>
    </section>

    <main class="container">
        <div id="favorites-grid" class="grid-cards" style="margin-top: -1rem;"></div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/backend.js"></script>
    <script>
        function renderFavorites() {
            const favIds = getFavorites();
            const props = getProperties();
            const favProps = props.filter(p => favIds.includes(p.id));
            const grid = document.getElementById('favorites-grid');
            const subtitle = document.getElementById('fav-subtitle');

            subtitle.innerText = favProps.length
                ? `Tenés ${favProps.length} propiedad${favProps.length === 1 ? '' : 'es'} guardada${favProps.length === 1 ? '' : 's'}.`
                : 'Todavía no guardaste ninguna propiedad.';

            if (favProps.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-regular fa-heart"></i>
                        <h3>Tu lista de favoritos está vacía</h3>
                        <p>Tocá el corazón de cualquier propiedad del catálogo para guardarla acá.</p>
                        <a href="catalogo.html" class="btn btn-primary" style="margin-top: 1.25rem;">Explorar catálogo</a>
                    </div>
                `;
                return;
            }

            grid.innerHTML = favProps.map(p => renderPropertyCard(p)).join('');
        }

        document.addEventListener('DOMContentLoaded', renderFavorites);
    </script>
    <script src="js/asistente.js"></script>
</body>
</html>
