<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendedores — InmoPermutas</title>
    <meta name="description" content="Conocé a las personas que publican sus propiedades para permuta directamente en InmoPermutas, sin intermediarios.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo"><span class="logo-mark"><i class="fa-solid fa-right-left"></i></span>Inmo<span class="logo-accent">Permutas</span><span class="logo-suffix">.com</span></a>
            <button class="nav-toggle" onclick="toggleMobileNav()" aria-label="Abrir menú"><i class="fa-solid fa-bars"></i></button>
            <nav class="nav-menu" id="nav-menu">
                <a href="index.html">Inicio</a>
                <a href="funcionamiento.html">Cómo funciona</a>
                <a href="catalogo.html">Propiedades</a>
                <a href="vendedores.html" class="active">Vendedores</a>
            </nav>
            <div class="nav-actions">
                <a href="favoritos.html" class="icon-btn" id="fav-icon-btn" aria-label="Favoritos" title="Favoritos">
                    <i class="fa-solid fa-heart"></i>
                    <span class="fav-count" id="fav-count">0</span>
                </a>
                <a href="publicar.html" class="btn btn-accent"><i class="fa-solid fa-circle-plus"></i> Publicar</a>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="section-header">
            <div class="section-title">
                <h1 style="font-size: 1.75rem; font-weight: 600;">Vendedores</h1>
                <p>Personas que publican sus propiedades directamente para encontrar su permuta, sin inmobiliarias de por medio.</p>
            </div>
        </div>

        <div id="sellers-grid" class="sellers-grid"></div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script>
        // Agrupa las propiedades por vendedor para mostrar un perfil por persona,
        // no por inmobiliaria: acá quien publica es siempre el propietario.
        function renderSellers() {
            const props = getProperties();
            const sellersMap = {};

            props.forEach(p => {
                const key = p.seller.name;
                if (!sellersMap[key]) {
                    sellersMap[key] = { ...p.seller, count: 0, mainLocation: p.location, city: p.city };
                }
                sellersMap[key].count += 1;
            });

            const grid = document.getElementById('sellers-grid');
            grid.innerHTML = Object.values(sellersMap).map(s => `
                <div class="seller-card">
                    <img src="${s.avatar}" alt="${s.name}" class="seller-avatar">
                    <h3 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 0.25rem;">${s.name}</h3>
                    <p style="color: var(--stone); font-size: 0.85rem; margin-bottom: 1rem;"><i class="fa-solid fa-location-dot"></i> ${s.mainLocation}, ${s.city}</p>
                    <p style="font-size: 0.9rem; color: var(--ink); margin-bottom: 1.5rem;"><i class="fa-solid fa-user"></i> Propietario particular</p>
                    <a href="catalogo.html?location=${encodeURIComponent(s.mainLocation)}" class="btn btn-outline btn-sm btn-block">Ver ${s.count} propiedad${s.count === 1 ? '' : 'es'}</a>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', renderSellers);
    </script>
</body>
</html>
