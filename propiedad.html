<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Propiedad — InmoPermutas</title>
    <meta name="description" content="Detalle de propiedad disponible para permuta en InmoPermutas, con opciones similares y contacto directo.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html#inicio" class="logo-brand">
                <div class="logo-graphic">
                    <svg viewBox="0 0 120 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="brand-svg">
                        <defs>
                            <linearGradient id="brandGreen" x1="10" y1="15" x2="42" y2="65" gradientUnits="userSpaceOnUse">
                                <stop offset="0" stop-color="#a8f14d"/>
                                <stop offset="1" stop-color="#1fa851"/>
                            </linearGradient>
                            <linearGradient id="brandBlue" x1="24" y1="60" x2="106" y2="70" gradientUnits="userSpaceOnUse">
                                <stop offset="0" stop-color="#5bd0ff"/>
                                <stop offset="1" stop-color="#1f5fd6"/>
                            </linearGradient>
                        </defs>
                        <path d="M 60 6 L 103 40 L 103 66" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M 60 6 L 24 34 L 24 60" stroke="url(#brandGreen)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M 10 46 L 24 62 L 40 46" stroke="url(#brandGreen)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M 98 64 C 112 84 72 94 34 78" stroke="url(#brandBlue)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M 36 64 L 19 78 L 36 92" stroke="url(#brandBlue)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="logo-text-group">
                    <div class="logo-title">Inmo<span class="accent-green">Permutas</span><span class="logo-dot">.com</span></div>
                    <div class="logo-tagline">TU PROPIEDAD, <span class="accent-green">OTRA OPORTUNIDAD</span></div>
                </div>
            </a>
            <button class="nav-toggle" onclick="toggleMobileNav()" aria-label="Abrir menú"><i class="fa-solid fa-bars"></i></button>
            <nav class="nav-menu" id="nav-menu">
                <a href="index.html">Inicio</a>
                <a href="catalogo.html">Propiedades</a>
                <a href="planes.html">Planes</a>
            </nav>
            <div class="nav-actions">
                <a href="favoritos.html" class="icon-btn" id="fav-icon-btn" aria-label="Favoritos" title="Favoritos">
                    <i class="fa-solid fa-heart"></i>
                    <span class="fav-count" id="fav-count">0</span>
                </a>
                <a href="catalogo.html" class="btn btn-outline btn-sm">Volver al catálogo</a>
            </div>
        </div>
    </header>

    <main class="property-container" id="property-detail-view">
        <!-- Se inyecta dinámicamente con JS según el ID de la URL -->
    </main>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/backend.js"></script>
    <script>
        // El contacto se desbloquea cuando el usuario tiene un plan vigente
        // (lo lee backend.js desde Firestore). Sin plan, queda difuminado.
        function contactoBloqueado() {
            return !(window.IP && IP.planActivo && IP.planActivo());
        }

        // Galería de fotos y videos. Si la propiedad no tiene archivos subidos
        // (o es una publicación vieja), se muestra solo la imagen principal.
        let galeriaItems = [];

        function pintarGaleriaPrincipal(i) {
            const it = galeriaItems[i];
            const main = document.getElementById('gallery-main');
            if (!it || !main) return;
            main.innerHTML = it.type === 'video'
                ? `<video src="${it.url}" controls playsinline class="property-hero-img" style="object-fit:contain;"></video>`
                : `<img src="${it.url}" alt="" class="property-hero-img">`;
            document.querySelectorAll('.property-media-thumb').forEach((t, k) => t.classList.toggle('active', k === i));
        }

        function galeriaHTML(property) {
            const media = Array.isArray(property.media) ? property.media.filter(m => m && m.url) : [];
            galeriaItems = media.length ? media : [{ type: 'image', url: property.image }];
            const primero = galeriaItems[0];
            const principal = primero.type === 'video'
                ? `<video src="${primero.url}" controls playsinline class="property-hero-img" style="object-fit:contain;"></video>`
                : `<img src="${primero.url}" alt="${property.title}" class="property-hero-img">`;
            const thumbs = galeriaItems.length > 1 ? `
                <div class="property-media-thumbs">
                    ${galeriaItems.map((m, i) => `
                        <button type="button" class="property-media-thumb ${i === 0 ? 'active' : ''}" onclick="pintarGaleriaPrincipal(${i})" aria-label="Ver archivo ${i + 1}">
                            ${m.type === 'video'
                                ? `<video src="${m.url}" muted preload="metadata"></video><i class="fa-solid fa-circle-play thumb-play"></i>`
                                : `<img src="${m.url}" alt="">`}
                        </button>`).join('')}
                </div>` : '';
            return `<div class="property-gallery"><div id="gallery-main">${principal}</div>${thumbs}</div>`;
        }

        // renderDetalle() está declarada como función global a propósito:
        // backend.js la vuelve a llamar cuando llegan los datos de la base,
        // así una propiedad recién publicada se ve aunque entres con el link
        // directo, sin datos todavía en el navegador.
        function renderDetalle() {
            const container = document.getElementById('property-detail-view');
            if (!container) return;

            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const props = getProperties();

            // Todavía no llegó nada de la base: mostramos un cartel de espera.
            if (props.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-circle-notch fa-spin"></i><h3>Cargando la propiedad…</h3></div>`;
                return;
            }

            const property = props.find(p => String(p.id) === String(id));

            if (!property) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-house-circle-xmark"></i>
                        <h3>No encontramos esta propiedad</h3>
                        <p>Puede que se haya dado de baja o que el link esté incompleto.</p>
                        <a href="catalogo.html" class="btn btn-primary" style="margin-top: 1.25rem;">Ver el catálogo</a>
                    </div>`;
                return;
            }

            // calcularCompatibilidad vive en utils.js (usa el campo "wants" de
            // cada propiedad para calcular el match en las dos direcciones).
            // Se excluyen las propias: no tiene sentido sugerirte matchear con vos mismo.
            const similarMatches = props
                .filter(p => String(p.id) !== String(property.id))
                .filter(p => !window.IP || !IP.user || p.ownerUid !== IP.user.uid)
                .map(p => ({ ...p, matchPercent: calcularCompatibilidad(property, p) }))
                .sort((a, b) => b.matchPercent - a.matchPercent)
                .slice(0, 3);

            const v = property.seller;
            const avatarVendedor = v.avatar
                ? `<img src="${v.avatar}" alt="${v.name}">`
                : `<div class="seller-avatar-fallback">${(v.name || '?').charAt(0).toUpperCase()}</div>`;

            // Bloqueado: el botón va difuminado y NO lleva el teléfono en el HTML.
            const contactoHTML = contactoBloqueado() ? `
                <div class="seller-contact">
                    <div class="seller-contact-btnwrap">
                        <div class="seller-contact-blur" aria-hidden="true">
                            <span class="btn btn-accent btn-block"><i class="fa-brands fa-whatsapp"></i> Contactar por WhatsApp</span>
                        </div>
                        <span class="seller-lock-icon"><i class="fa-solid fa-lock"></i></span>
                    </div>
                    <p>Para ver el contacto, consultá nuestros planes.</p>
                    <a href="planes.html" class="btn btn-accent btn-sm">Ver planes</a>
                </div>` : `
                <div class="seller-contact-open">
                    <a href="https://wa.me/${v.phone}?text=Hola,%20me%20interesa%20coordinar%20una%20permuta%20por%20la%20propiedad:%20${encodeURIComponent(property.title)}" target="_blank" rel="noopener" class="btn btn-accent btn-block"><i class="fa-brands fa-whatsapp"></i> Contactar por WhatsApp</a>
                </div>`;

            // Superficie cubierta y del terreno: opcionales. Si no se cargaron
            // (0 o vacío) no se muestra la línea, para no dejar campos vacíos.
            const cubierta = Number(property.superficieCubierta) || 0;
            const terreno = Number(property.superficieTerreno) || 0;
            const superficiesHTML = (cubierta || terreno) ? `
                        <ul class="property-surfaces">
                            ${cubierta ? `<li><i class="fa-solid fa-house"></i> Superficie cubierta: <strong>${cubierta.toLocaleString('es-AR')} m²</strong></li>` : ''}
                            ${terreno ? `<li><i class="fa-solid fa-tree"></i> Superficie del terreno: <strong>${terreno.toLocaleString('es-AR')} m²</strong></li>` : ''}
                        </ul>` : '';

            const fav = isFavorite(property.id);
            const idSeguro = String(property.id).replace(/'/g, "\\'");

            container.innerHTML = `
                <div style="margin-bottom: 1.5rem; display:flex; align-items:flex-start; justify-content:space-between; gap:1rem;">
                    <div>
                        <span class="eyebrow-badge"><i class="fa-solid fa-right-left"></i> Propiedad verificada para permuta</span>
                        <h1 style="font-size: 2.3rem; margin-top: 0.4rem;">${property.title}</h1>
                        <div id="detail-match-badge" class="detail-match-badge"></div>
                        <p style="color: var(--stone); font-size: 1.05rem; margin-top:0.3rem;"><i class="fa-solid fa-location-dot" style="color:var(--teal);"></i> ${property.barrio ? 'Barrio ' + property.barrio + ' · ' : ''}${property.location}, ${property.city}</p>
                    </div>
                    <button class="icon-btn ${fav ? 'has-favs' : ''}" style="width:48px;height:48px;font-size:1.15rem;" onclick="handleFavoriteClick(event, '${idSeguro}')" aria-label="Guardar en favoritos">
                        <i class="fa-${fav ? 'solid' : 'regular'} fa-heart" style="color:${fav ? 'var(--coral)' : 'inherit'};"></i>
                    </button>
                </div>

                ${galeriaHTML(property)}

                <div class="property-grid">
                    <div class="info-card">
                        <div class="price-tag">${property.currency} ${Number(property.price).toLocaleString()}</div>
                        <h3>Características principales</h3>
                        <p style="color: var(--stone); margin-bottom: ${superficiesHTML ? '0.9rem' : '1.5rem'};"><i class="fa-solid fa-bed"></i> ${property.bedrooms} dormitorios &nbsp;&bull;&nbsp; <i class="fa-solid fa-ruler-combined"></i> ${property.area} m² totales</p>
                        ${superficiesHTML}

                        <h3>Descripción de la oportunidad</h3>
                        <p style="color: var(--stone); line-height: 1.7; margin-bottom: 1.5rem;">Inmueble habilitado para intercambio directo. El propietario evalúa ofertas de menor o mayor valor con ajuste de diferencia en efectivo.</p>

                        <div class="permuta-match-box">
                            <h4><i class="fa-solid fa-arrows-rotate"></i> Criterio de permuta esperado</h4>
                            <p>${describirWants(property.wants)}</p>
                        </div>
                    </div>

                    <div class="info-card seller-box">
                        <div class="seller-head">
                            <div class="seller-avatar-ring">${avatarVendedor}</div>
                            <h3>${property.seller.name}</h3>
                            <span class="seller-chip"><i class="fa-solid fa-user-check"></i> Propietario particular</span>
                            <p class="seller-role">Publica directamente, sin inmobiliaria</p>
                        </div>
                        ${contactoHTML}
                    </div>
                </div>

                <div style="margin-top: 4rem;">
                    <div class="section-header">
                        <div class="section-title">
                            <h2>Opciones similares con % de match</h2>
                            <p>Inmuebles calculados por nuestro algoritmo en base a ubicación y características.</p>
                        </div>
                    </div>

                    <div class="grid-cards" style="margin-top: 1rem;">
                        ${similarMatches.map(m => renderPropertyCard(m, m.matchPercent)).join('')}
                    </div>
                </div>
            `;

            pintarMatchPropio(property);
            updateFavCount();
        }

        // Muestra, junto al título, el % de match entre ESTA propiedad y la
        // propiedad propia de quien está mirando (si tiene una publicada).
        // Usa el mismo algoritmo de calcularCompatibilidad() de utils.js.
        function pintarMatchPropio(property) {
            const cont = document.getElementById('detail-match-badge');
            if (!cont) return;

            if (!window.IP || IP.error) { cont.innerHTML = ''; return; }

            if (!IP.user) {
                cont.innerHTML = `<a href="publicar.html" class="detail-match-cta"><i class="fa-solid fa-right-left"></i> Ingresá y publicá tu propiedad para ver tu % de match</a>`;
                return;
            }
            if (property.ownerUid === IP.user.uid) {
                cont.innerHTML = ''; // es tu propia publicación, no hay match que calcular
                return;
            }

            const misPropiedades = getProperties().filter(p => !p.esDemo && p.ownerUid === IP.user.uid);
            if (!misPropiedades.length) {
                cont.innerHTML = `<a href="publicar.html" class="detail-match-cta"><i class="fa-solid fa-right-left"></i> Publicá tu propiedad para ver tu % de match</a>`;
                return;
            }

            // Si tiene más de una propiedad publicada, se muestra la que mejor matchea.
            let mejor = null;
            misPropiedades.forEach(mia => {
                const pct = calcularCompatibilidad(property, mia);
                if (!mejor || pct > mejor.pct) mejor = { pct, titulo: mia.title };
            });

            cont.innerHTML = `<span class="detail-match-pct"><i class="fa-solid fa-arrows-rotate"></i> ${mejor.pct}% de match con tu propiedad "${mejor.titulo}"</span>`;
        }

        document.addEventListener('DOMContentLoaded', renderDetalle);
        // Si el plan cambia (o termina de cargar), se vuelve a pintar el contacto.
        document.addEventListener('ip-plan', renderDetalle);
    </script>
    <script src="js/asistente.js"></script>
</body>
</html>
