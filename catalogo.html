<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Permutas — InmoPermutas</title>
    <meta name="description" content="Explorá el catálogo completo de propiedades disponibles para permuta en InmoPermutas, filtrando por tipo, zona y precio.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html#inicio" class="logo-brand">
                <div class="logo-graphic">
                    <svg viewBox="0 0 120 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="brand-svg">
                        <defs>
                            <linearGradient id="brandGreen" x1="10" y1="15" x2="42" y2="65" gradientUnits="userSpaceOnUse">
                                <stop offset="0" stop-color="#a8f14d"/>
                                <stop offset="1" stop-color="#1fa851"/>
                            </linearGradient>
                            <linearGradient id="brandBlue" x1="24" y1="60" x2="106" y2="70" gradientUnits="userSpaceOnUse">
                                <stop offset="0" stop-color="#5bd0ff"/>
                                <stop offset="1" stop-color="#1f5fd6"/>
                            </linearGradient>
                        </defs>
                        <path d="M 60 6 L 103 40 L 103 66" stroke="#ffffff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M 60 6 L 24 34 L 24 60" stroke="url(#brandGreen)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M 10 46 L 24 62 L 40 46" stroke="url(#brandGreen)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M 98 64 C 112 84 72 94 34 78" stroke="url(#brandBlue)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M 36 64 L 19 78 L 36 92" stroke="url(#brandBlue)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="logo-text-group">
                    <div class="logo-title">Inmo<span class="accent-green">Permutas</span><span class="logo-dot">.com</span></div>
                    <div class="logo-tagline">TU PROPIEDAD, <span class="accent-green">OTRA OPORTUNIDAD</span></div>
                </div>
            </a>
            <button class="nav-toggle" onclick="toggleMobileNav()" aria-label="Abrir menú"><i class="fa-solid fa-bars"></i></button>
            <nav class="nav-menu" id="nav-menu">
                <a href="index.html">Inicio</a>
                <a href="catalogo.html" class="active">Propiedades</a>
            </nav>
            <div class="nav-actions">
                <a href="favoritos.html" class="icon-btn" id="fav-icon-btn" aria-label="Favoritos" title="Favoritos">
                    <i class="fa-solid fa-heart"></i>
                    <span class="fav-count" id="fav-count">0</span>
                </a>
                <a href="publicar.html" class="btn btn-accent"><i class="fa-solid fa-circle-plus"></i> Publicar</a>
            </div>
        </div>
    </header>

    <section class="page-band">
        <div class="container" style="padding-bottom: 2.5rem;">
            <div class="section-header">
                <div class="section-title">
                    <h1 id="results-count" style="font-size: 1.75rem; font-weight: 600;">Catálogo de Permutas</h1>
                    <p>Explorá inmuebles listos para el intercambio inteligente.</p>
                </div>
            </div>
        </div>
    </section>

    <div class="container">
        <div class="section-header">
            <div class="section-title">
                <h2>Propiedades <span>destacadas</span></h2>
                <p id="active-count-text">Encontrá la próxima oportunidad entre nuestras propiedades activas.</p>
            </div>
        </div>

        <div id="featured-grid" class="grid-cards"></div>
    </div>

    <main class="container">
        <div class="catalog-layout" style="margin-top: -2.5rem;">
            <!-- Panel de Filtros -->
            <aside class="filters-panel">
                <h3><i class="fa-solid fa-sliders"></i> Filtrar búsqueda</h3>

                <div class="filter-group">
                    <label>Tipo de Inmueble</label>
                    <select id="filter-type" onchange="applyCatalogFilters()">
                        <option value="">Todos</option>
                        <option value="Casa">Casa</option>
                        <option value="Departamento">Departamento</option>
                        <option value="Terreno">Terreno</option>
                        <option value="Negocio">Negocio</option>
                        <option value="Galpón">Galpón</option>
                        <option value="Garaje">Garaje</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Ubicación / Zona</label>
                    <input type="text" id="filter-location" placeholder="Cualquier ciudad o provincia de Argentina" oninput="applyCatalogFilters()">
                </div>

                <div class="filter-group">
                    <label>Precio Máximo (US$)</label>
                    <input type="number" id="filter-price" placeholder="Ej: 500000" oninput="applyCatalogFilters()">
                </div>

                <div class="filter-group">
                    <label>Ordenar por</label>
                    <select id="filter-sort" onchange="applyCatalogFilters()">
                        <option value="default">Más relevantes</option>
                        <option value="price-asc">Precio: menor a mayor</option>
                        <option value="price-desc">Precio: mayor a menor</option>
                        <option value="area-desc">Superficie: mayor a menor</option>
                    </select>
                </div>

                <button class="btn btn-outline btn-block" onclick="resetFilters()">Limpiar filtros</button>

                <div class="filters-ia-hint">
                    <p>¿Preferís no filtrar a mano?</p>
                    <button type="button" class="btn btn-accent btn-block btn-sm" onclick="document.getElementById('ia-fab').click()"><i class="fa-solid fa-wand-magic-sparkles"></i> Buscar con el asistente IA</button>
                </div>
            </aside>

            <!-- Grilla de Resultados -->
            <section>
                <div id="catalog-grid" class="grid-cards"></div>
            </section>
        </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/backend.js"></script>
    <script>
        function applyCatalogFilters() {
            const type = document.getElementById('filter-type').value;
            const location = document.getElementById('filter-location').value.toLowerCase();
            const maxPrice = Number(document.getElementById('filter-price').value) || Infinity;
            const sort = document.getElementById('filter-sort').value;

            const props = getProperties();
            let filtered = props.filter(p => {
                if (type && p.type !== type) return false;
                if (location && !p.location.toLowerCase().includes(location) && !p.city.toLowerCase().includes(location) && !p.title.toLowerCase().includes(location)) return false;
                if (p.price > maxPrice) return false;
                return true;
            });

            if (sort === 'price-asc') filtered.sort((a, b) => a.price - b.price);
            else if (sort === 'price-desc') filtered.sort((a, b) => b.price - a.price);
            else if (sort === 'area-desc') filtered.sort((a, b) => b.area - a.area);

            const grid = document.getElementById('catalog-grid');
            document.getElementById('results-count').innerText = `${filtered.length} propiedad${filtered.length === 1 ? '' : 'es'} encontrada${filtered.length === 1 ? '' : 's'}`;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="empty-state"><i class="fa-solid fa-magnifying-glass"></i><h3>No se encontraron permutas con esos criterios.</h3><p>Probá ampliar la zona o subir el precio máximo.</p></div>`;
                return;
            }

            grid.innerHTML = filtered.map(p => renderPropertyCard(p)).join('');
        }

        function resetFilters() {
            document.getElementById('filter-type').value = '';
            document.getElementById('filter-location').value = '';
            document.getElementById('filter-price').value = '';
            document.getElementById('filter-sort').value = 'default';
            applyCatalogFilters();
        }

        // Si venimos del buscador del home (index.html), precargamos los filtros
        // con lo que el usuario escribió ahí.
        function loadFiltersFromURL() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('type')) document.getElementById('filter-type').value = params.get('type');
            if (params.get('location')) document.getElementById('filter-location').value = params.get('location');
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadFiltersFromURL();
            applyCatalogFilters();
        });
    </script>
    <script src="js/asistente.js"></script>
</body>
</html>
